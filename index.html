<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>le beau rôle. — Pilotage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d11'/%3E%3Ccircle cx='11' cy='16' r='4.5' fill='none' stroke='%23e0a94e' stroke-width='2.4'/%3E%3Ccircle cx='21' cy='16' r='4.5' fill='none' stroke='%23e0a94e' stroke-width='2.4' opacity='.45'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c0d11; --bg2:#0f1116; --panel:#131519; --panel2:#181b22; --panel3:#1e2229;
  --line:rgba(236,233,225,.075); --line2:rgba(236,233,225,.14);
  --txt:#ece9e1; --txt2:#a8a4b0; --txt3:#6d6a79;
  --gold:#e0a94e; --gold2:#f1c97b;
  --spotify:#2ec46d; --yt:#ff5c50; --deezer:#a868ff; --apple:#c46bd9; --web:#5aa7f0; --ablog:#e0813f; --autre:#8b90a0;
  --green:#3ecf8e; --red:#ff6b62;
  --r:14px; --rs:9px;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(900px 500px at 85% -10%, rgba(224,169,78,.055), transparent 60%),
   radial-gradient(700px 500px at -10% 110%, rgba(90,167,240,.04), transparent 60%)}
::selection{background:rgba(224,169,78,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#262a33;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-columns:228px 1fr;min-height:100vh;position:relative;z-index:1}

/* ---------- Sidebar ---------- */
#sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 18px 18px;
  border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(19,21,25,.6),rgba(12,13,17,.2))}
.brand{padding:4px 10px 24px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand h1{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.2px;color:var(--txt)}
.brand h1 em{font-style:italic;color:var(--gold)}
.brand small{display:block;margin-top:5px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt3)}
nav{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--txt2);
  cursor:pointer;border:1px solid transparent;transition:.22s;user-select:none;font-size:13.5px}
.navitem svg{width:17px;height:17px;stroke:var(--txt3);transition:.22s;flex:none}
.navitem:hover{color:var(--txt);background:rgba(236,233,225,.035)}
.navitem.on{color:var(--txt);background:rgba(224,169,78,.09);border-color:rgba(224,169,78,.16)}
.navitem.on svg{stroke:var(--gold)}
.sidefoot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sidechip{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--txt3);padding:2px 12px}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(62,207,142,.5);animation:pulse 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,207,142,.45)}70%{box-shadow:0 0 0 7px rgba(62,207,142,0)}100%{box-shadow:0 0 0 0 rgba(62,207,142,0)}}

/* ---------- Main / topbar ---------- */
#main{min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 30px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb-title h2{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.2px}
.tb-title p{color:var(--txt3);font-size:12.5px;margin-top:3px}
.tb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--txt2);border:1px solid var(--line2);
  border-radius:99px;padding:5px 12px;background:var(--panel)}
.chip b{color:var(--txt);font-weight:600}
.btn{appearance:none;border:1px solid var(--line2);background:var(--panel);color:var(--txt2);font:inherit;font-size:12.5px;
  padding:7px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.18s;white-space:nowrap}
.btn:hover{color:var(--txt);border-color:rgba(224,169,78,.4);background:var(--panel2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,rgba(224,169,78,.2),rgba(224,169,78,.1));border-color:rgba(224,169,78,.45);color:var(--gold2)}
.btn.primary:hover{background:linear-gradient(180deg,rgba(224,169,78,.3),rgba(224,169,78,.16))}
.btn.danger:hover{border-color:rgba(255,107,98,.45);color:var(--red)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
#content{padding:24px 30px 60px;flex:1}

/* ---------- Views ---------- */
.view{display:none}
.view.on{display:block;animation:viewin .45s cubic-bezier(.22,.8,.3,1) both}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;position:relative;overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s;
  animation:cardin .6s cubic-bezier(.22,.8,.3,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes cardin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{border-color:rgba(236,233,225,.16)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--txt)}
.card-h .sub{font-size:11.5px;color:var(--txt3)}
.hint{font-size:11px;color:var(--txt3);font-style:italic;font-family:var(--serif)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}
.s12{grid-column:span 12}.s2{grid-column:span 2}
@media(max-width:1100px){.s3{grid-column:span 6}.s4{grid-column:span 6}.s8{grid-column:span 12}.s6{grid-column:span 12}.s2{grid-column:span 4}}
@media(max-width:640px){.s3,.s4,.s2{grid-column:span 12}}

/* KPI hero */
.kpi .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kpi .lab i{width:8px;height:8px;border-radius:3px;background:var(--ac,var(--gold));display:inline-block}
.kpi .val{font-size:32px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .val small{font-size:15px;color:var(--txt3);font-weight:500;margin-left:2px}
.kpi .foot{margin-top:9px;font-size:11.5px;color:var(--txt2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpi .foot .up{color:var(--green)}.kpi .foot .dn{color:var(--red)}
.kpi::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(224,169,78,.35),transparent);opacity:.7}
.kpi{transition:transform .25s,border-color .25s}
.kpi:hover{transform:translateY(-2px)}
.kpi .stroke{position:absolute;inset:0;pointer-events:none}
.minikpi{padding:13px 16px}
.minikpi .lab{font-size:10.5px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.minikpi .val{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.minikpi .val small{font-size:11px;color:var(--txt3)}
.minikpi .foot{font-size:10.5px;color:var(--txt3);margin-top:4px}

/* charts */
.chartwrap{position:relative;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--txt2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
#tooltip{position:fixed;z-index:99;pointer-events:none;background:rgba(16,17,22,.96);border:1px solid var(--line2);
  border-radius:10px;padding:9px 12px;font-size:12px;color:var(--txt);box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:260px}
#tooltip.show{opacity:1;transform:none}
#tooltip .tt-t{font-weight:600;margin-bottom:5px;font-size:12.5px}
#tooltip .tt-r{display:flex;justify-content:space-between;gap:14px;color:var(--txt2)}
#tooltip .tt-r b{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:600}
#tooltip .tt-r i{width:8px;height:8px;border-radius:2.5px;display:inline-block;margin-right:6px;vertical-align:-1px}
svg text{font-family:var(--sans)}

/* controls */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{appearance:none;border:0;background:transparent;color:var(--txt3);font:inherit;font-size:12px;padding:7px 14px;cursor:pointer;transition:.18s}
.seg button.on{color:var(--gold2);background:rgba(224,169,78,.12)}
.seg button:hover:not(.on){color:var(--txt2)}
input[type=search],input[type=text],select{background:var(--panel);border:1px solid var(--line2);color:var(--txt);
  border-radius:9px;padding:7px 12px;font:inherit;font-size:12.5px;outline:none;transition:border-color .18s}
input:focus,select:focus{border-color:rgba(224,169,78,.5)}

/* table */
.tblwrap{overflow:auto;max-height:560px;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--panel2);z-index:2;text-align:right;padding:10px 12px;font-weight:600;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
thead th:nth-child(-n+4){text-align:left}
thead th:hover{color:var(--txt)}
thead th .dir{color:var(--gold);margin-left:3px}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;color:var(--txt2);white-space:nowrap}
tbody td:nth-child(-n+4){text-align:left}
tbody td.ttl{color:var(--txt);max-width:280px;overflow:hidden;text-overflow:ellipsis}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:rgba(224,169,78,.05)}
tbody tr.dim td{opacity:.38}
.badge{display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:99px;border:1px solid;font-variant-numeric:normal}
.b-pub{color:#8fd6ae;border-color:rgba(62,207,142,.3);background:rgba(62,207,142,.07)}
.b-enc{color:var(--gold2);border-color:rgba(224,169,78,.35);background:rgba(224,169,78,.08)}
.b-nnc{color:var(--txt3);border-color:var(--line2);background:rgba(255,255,255,.02)}
.epno{font-family:var(--serif);font-style:italic;color:var(--gold);font-weight:600}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(5,6,9,.6);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:var(--bg2);border-left:1px solid var(--line2);
  z-index:41;transform:translateX(103%);transition:transform .38s cubic-bezier(.22,.8,.3,1);overflow-y:auto;padding:26px 26px 40px}
#drawer.show{transform:none}
.dr-close{position:absolute;top:16px;right:16px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt2);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1}
.dr-close:hover{color:var(--txt)}
.dr-num{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--gold);margin-bottom:5px}
.dr-title{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.25;margin-bottom:4px}
.dr-hook{font-family:var(--serif);font-style:italic;color:var(--txt2);font-size:13.5px;margin:8px 0 2px}
.dr-meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}
.dr-meta span{font-size:11px;color:var(--txt2);border:1px solid var(--line2);border-radius:99px;padding:4px 10px;background:var(--panel)}
.dr-sec{margin-top:22px}
.dr-sec h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);margin-bottom:11px;display:flex;align-items:center;gap:10px}
.dr-sec h4::after{content:"";flex:1;height:1px;background:var(--line)}
.drow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed rgba(236,233,225,.06);font-size:12.5px}
.drow .k{color:var(--txt2)}
.drow .v{font-variant-numeric:tabular-nums;font-weight:600}
.drow .v.mut{color:var(--txt3);font-weight:400}
.drow .v.gold{color:var(--gold2)}

/* edit form */
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed-field label{display:block;font-size:10.5px;color:var(--txt3);margin-bottom:5px;letter-spacing:.04em}
.ed-field input{width:100%}
.ed-actions{display:flex;gap:8px;margin-top:18px}
.note-edit{font-size:11px;color:var(--txt3);margin-top:10px;font-style:italic;font-family:var(--serif)}

/* funnel */
.fstep{margin-bottom:12px}
.fstep .fk{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.fstep .fk b{font-variant-numeric:tabular-nums}
.fstep .fk span{color:var(--txt3)}
.fstep .fb{height:26px;border-radius:7px;background:var(--panel3);overflow:hidden;position:relative}
.fstep .fb i{position:absolute;inset:0;border-radius:7px;background:linear-gradient(90deg,var(--fc,#e0a94e),color-mix(in srgb,var(--fc,#e0a94e) 55%, transparent));
  width:var(--w,0%);transition:width 1s cubic-bezier(.22,.8,.3,1);}
.fstep .fb em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10.5px;font-style:normal;color:rgba(255,255,255,.75)}

/* production */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl-item{position:relative;padding:8px 0 8px 8px}
.tl-item::before{content:"";position:absolute;left:-19px;top:14px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--txt3)}
.tl-item.pub::before{border-color:var(--green);background:var(--green)}
.tl-item.enc::before{border-color:var(--gold);box-shadow:0 0 0 4px rgba(224,169,78,.14)}
.tl-item .d{font-size:10.5px;color:var(--txt3);letter-spacing:.06em;text-transform:uppercase}
.tl-item .t{font-size:12.5px;color:var(--txt);margin-top:2px}
.tl-item .t i{font-family:var(--serif);font-style:italic;color:var(--gold);margin-right:6px}
.prog{height:5px;border-radius:99px;background:var(--panel3);overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width 1.1s cubic-bezier(.22,.8,.3,1)}
.chk{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chk .ck{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--txt2)}
.chk .ck.done{color:var(--txt3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2)}
.chk .box{width:14px;height:14px;border-radius:4.5px;border:1.5px solid var(--txt3);flex:none;display:grid;place-items:center}
.chk .ck.done .box{background:var(--gold);border-color:var(--gold)}
.chk .box svg{width:9px;height:9px;stroke:#141519;stroke-width:3;fill:none;opacity:0}
.chk .ck.done .box svg{opacity:1}

/* tops */
.topitem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.topitem:last-child{border:none}
.topitem .tt{font-size:12.5px;color:var(--txt)}
.topitem .tt small{color:var(--txt3);font-size:10.5px;margin-left:6px}
.topitem .imp{font-variant-numeric:tabular-nums;font-weight:650;color:var(--gold2);font-size:13px}
.topitem .split{grid-column:1/-1;display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--panel3)}
.topitem .split i{height:100%;transition:width 1s cubic-bezier(.22,.8,.3,1)}
.tabs{display:flex;gap:6px}
.tabs button{appearance:none;background:transparent;border:1px solid var(--line2);color:var(--txt3);font:inherit;font-size:11.5px;
  padding:5px 12px;border-radius:99px;cursor:pointer;transition:.18s}
.tabs button.on{color:var(--gold2);border-color:rgba(224,169,78,.4);background:rgba(224,169,78,.09)}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--line2);
  color:var(--txt);padding:10px 18px;border-radius:11px;font-size:13px;z-index:60;opacity:0;transition:.3s;pointer-events:none;
  box-shadow:0 12px 34px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast b{color:var(--gold2)}

/* burger */
#burger{display:none;position:fixed;top:14px;left:14px;z-index:30;background:var(--panel2);border:1px solid var(--line2);
  color:var(--txt);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:17px}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  #sidebar{position:fixed;z-index:50;width:240px;transform:translateX(-104%);transition:transform .32s;background:var(--bg2)}
  #sidebar.open{transform:none}
  #burger{display:block}
  #content{padding:18px 14px 60px}
  #topbar{padding:20px 14px 14px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>

        </button>

<script>
'use strict';
/* =========================================================

   ========================================================= */
const SEED = JSON.parse(document.getElementById('seed-data').textContent);

let DATA;
try{
  const stored = localStorage.getItem('lbr-data');
  DATA = stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(SEED));
}catch(e){ DATA = JSON.parse(JSON.stringify(SEED)); }
const persist = () => { try{ localStorage.setItem('lbr-data', JSON.stringify(DATA)); }catch(e){} };
const isModified = () => { try{ return !!localStorage.getItem('lbr-data'); }catch(e){ return false; } };

/* ---------- formatage ---------- */
const NF0 = new Intl.NumberFormat('fr-FR', {maximumFractionDigits:0});
const NF1 = new Intl.NumberFormat('fr-FR', {minimumFractionDigits:1, maximumFractionDigits:1});
const NF2 = new Intl.NumberFormat('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fi = n => n==null ? '—' : NF0.format(Math.round(n));
const f1 = n => n==null ? '—' : NF1.format(n);
const f2 = n => n==null ? '—' : NF2.format(n);
const fp = (n,d=0) => n==null ? '—' : (n*100).toLocaleString('fr-FR',{maximumFractionDigits:d,minimumFractionDigits:d===undefined?0:d})+' %';
const fpc = (n,d=0) => n==null ? '—' : ((n*100).toFixed(d).replace('.',',')+' %');
function fdur(s){
  if(s==null) return '—';
  const h = Math.floor(s/3600), m = Math.round((s%3600)/60);
  if(h>0) return h+' h '+String(m).padStart(2,'0');
  if(m>0) return m+' min';
  return s+' s';
}
function fdate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
}
const MOIS_L = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MOIS_S = ['Janv.','Févr.','Mars','Avr.','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
function fmonth(label){
  const m = label.match(/(\w+)\s+(\d{4})/);
  if(!m) return label;
  const idx = MOIS_L.findIndex(x => m[1].toLowerCase().startsWith(x.slice(0,4).toLowerCase()));
  return (idx>=0 ? MOIS_S[idx] : m[1]);
}
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- svg helpers ---------- */
const svgNS = 'http://www.w3.org/2000/svg';
const animOK = () => (typeof ANIM==='undefined' || ANIM) && !matchMedia('(prefers-reduced-motion: reduce)').matches;
function S(tag, attrs, parent){
  const el = document.createElementNS(svgNS, tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(el);
  return el;
}
function el(htmlStr){
  const t = document.createElement('template');
  t.innerHTML = htmlStr.trim();
  return t.content.firstElementChild;
}
function card(cls, title, sub, i){
  return el(`<div class="card ${cls}" style="--i:${i||0}">
    ${title?`<div class="card-h"><h3>${title}</h3>${sub?`<span class="sub">${sub}</span>`:''}</div>`:''}
    <div class="cbody"></div></div>`);
}
function countUp(node, target, fmt){
  if(!animOK()){ node.textContent = fmt(target); return; }
  const t0 = performance.now(), dur = 1100 + Math.min(600, String(target).length*40);
  function tick(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    node.textContent = fmt(target*e);
    if(p<1) requestAnimationFrame(tick); else node.textContent = fmt(target);
  }
  requestAnimationFrame(tick);
}

/* --- courbes / aires --- */
function lineChart(host, cfg){
  host.innerHTML = '';
  const W = host.clientWidth || 600, H = cfg.height||240;
  const mL = 46, mR = cfg.axisR?54:16, mT = 14, mB = 30;
  const iw = W-mL-mR, ih = H-mT-mB;
  const svg = S('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`},host);
  svg.style.display='block';

  const n = cfg.xLabels.length;
  const allVals = cfg.series.flatMap(s => s.points.filter(v=>v!=null));
  let ymax = cfg.ymax != null ? cfg.ymax : Math.max(...allVals,0);
  if(cfg.ymaxTight) ymax = Math.max(...allVals,1e-9);
  const ymin = cfg.ymin!=null ? cfg.ymin : 0;
  const X = i => mL + (n<=1?iw/2:i*iw/(n-1));
  const Y = v => mT + ih - ((v-ymin)/(ymax-ymin))*ih;

  /* grille horizontale */
  const ticks = 4;
  for(let t=0;t<=ticks;t++){
    const v = ymin + (ymax-ymin)*t/ticks, y = Y(v);
    S('line',{x1:mL,x2:W-mR,y1:y,y2:y,stroke:'rgba(236,233,225,.06)','stroke-width':1},svg);
    S('text',{x:mL-8,y:y+3.5,'text-anchor':'end','font-size':10,fill:TXT3},svg).textContent = cfg.yFmt(v);
  }
  /* graduations X (max ~9) */
  const step = Math.max(1, Math.ceil(n/ Math.max(3, Math.floor(iw/58))));
  for(let i=0;i<n;i+=step){
    S('text',{x:X(i),y:H-9,'text-anchor':'middle','font-size':10,fill:TXT3},svg).textContent = cfg.xLabels[i];
  }
  if(cfg.xUnit) S('text',{x:W-mR,y:H-9,'text-anchor':'end','font-size':10,fill:TXT3},svg).textContent = cfg.xUnit;

  cfg.series.forEach(sr => {
    const pts = sr.points.map((v,i)=>[i,v]);
    const has = pts.filter(p=>p[1]!=null);
    if(!has.length) return;
    /* construction monotone */
    let d='', pen=false;
    for(let i=0;i<n;i++){
      const v = sr.points[i];
      if(v==null){ pen=false; continue; }
      const x=X(i), y=Y(v);
      if(!pen){ d += `M${x.toFixed(1)} ${y.toFixed(1)}`; pen=true; }
      else {
        const px=X(i-1)||x, py=sr.points[i-1]==null?y:Y(sr.points[i-1]);
        const cx1=(X(i-1))+(x-X(i-1))/2;
        d += ` C${cx1.toFixed(1)} ${py.toFixed(1)} ${cx1.toFixed(1)} ${y.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
      }
    }
    if(sr.area){
      const defs = S('defs',{},svg);
      const gid = 'g'+Math.random().toString(36).slice(2,8);
      const lg = S('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1},defs);
      S('stop',{offset:'0%','stop-color':sr.color,'stop-opacity':.28},lg);
      S('stop',{offset:'100%','stop-color':sr.color,'stop-opacity':0},lg);
      let da = d + ` L${X(has[has.length-1][0]).toFixed(1)} ${mT+ih} L${X(has[0][0]).toFixed(1)} ${mT+ih} Z`;
      const ap = S('path',{d:da,fill:`url(#${gid})`,stroke:'none'},svg);
      ap.style.opacity=0; ap.style.transition='opacity .9s .5s';
      requestAnimationFrame(()=>requestAnimationFrame(()=>ap.style.opacity=1));
    }
    const path = S('path',{d,fill:'none',stroke:sr.color,'stroke-width':sr.dashed?1.6:2.2,
      'stroke-linecap':'round','stroke-linejoin':'round',...(sr.dashed?{'stroke-dasharray':'1 0'}:{})},svg);
    if(animOK()){
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      path.getBoundingClientRect();
      path.style.transition = 'stroke-dashoffset 1.4s cubic-bezier(.3,.7,.2,1)';
      requestAnimationFrame(()=>path.style.strokeDashoffset = 0);
      setTimeout(()=>{ path.style.strokeDasharray='none'; }, 1600);
    }
    /* points */
    if(cfg.points!==false && has.length<=45){
      has.forEach(([i,v])=>{
        const c = S('circle',{cx:X(i),cy:Y(v),r:3,fill:sr.color,stroke:'#0c0d11','stroke-width':1.5,opacity:0,cursor:'pointer'},svg);
        c.style.transition='opacity .4s .9s';
        requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.opacity=.95));
        c.addEventListener('mouseenter',ev=>{
          c.setAttribute('r',4.5);
          ttShow(sr.tooltip?sr.tooltip(i,v):`<div class="tt-t">${esc(cfg.xLabels[i])}</div><div class="tt-r"><b>${cfg.yFmt(v)}</b></div>`,ev.clientX,ev.clientY);
        });
        c.addEventListener('mouseleave',()=>{c.setAttribute('r',3);ttHide();});
      });
    }
  });
  return {X, Y, svg};
}

/* --- barres (empilées ou non) --- */
function barChart(host, cfg){
  host.innerHTML='';
  const W = host.clientWidth||600, H = cfg.height||240;
  const mL=46, mR=cfg.axisR?14:10, mT=14, mB=34;
  const iw=W-mL-mR, ih=H-mT-mB;
  const svg=S('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`},host);
  svg.style.display='block';
  const n = cfg.xLabels.length;
  const stacked = cfg.stacked!==false;
  let ymax = 0;
  if(stacked) cfg.bars.forEach(b=>{ let t=0; cfg.series.forEach(s=>t+=Math.max(0,b.vals[s.key]||0)); ymax=Math.max(ymax,t); });
  else cfg.series.forEach(s=>cfg.bars.forEach(b=>ymax=Math.max(ymax,b.vals[s.key]||0)));
  if(cfg.marker) ymax=Math.max(ymax,...cfg.marker.map(m=>m.v));
  ymax = ymax||1;
  const yFac = cfg.ymaxPad ? ymax*cfg.ymaxPad : 1;
  const Xc = i => mL + iw*(i+.5)/n;
  const Y = v => mT + ih - (v/ymax)*ih*.98;
  for(let t=0;t<=4;t++){
    const v=ymax*t/4, y=Y(v);
    S('line',{x1:mL,x2:W-mR,y1:y,y2:y,stroke:'rgba(236,233,225,.06)'},svg);
    S('text',{x:mL-8,y:y+3.5,'text-anchor':'end','font-size':10,fill:TXT3},svg).textContent=cfg.yFmt(v);
  }
  const bw = Math.min(34, (iw/n)*0.62);
  const animDur = animOK()?700:0;
  cfg.bars.forEach((b,i)=>{
    let acc=0; const segs=[];
    cfg.series.forEach(s=>{ const v=b.vals[s.key]||0; if(v>0) segs.push({s,v}); });
    const x = Xc(i)-bw/(stacked?2:Math.max(1,cfg.series.length));
    cfg.series.forEach((s,si)=>{
      const v=b.vals[s.key]||0;
      if(v<=0) return;
      let y0,y1;
      if(stacked){ y1=Y(acc); y0=Y(acc+v); acc+=v; }
      else{ y0=Y(v); y1=Y(0); }
      const rect = S('rect',{x: stacked?x:x+bw*si*1.08 + si*2, y:y0, width:bw, height:Math.max(1.5,y1-y0), fill:s.color,
        rx:(!stacked||si===cfg.series.length-1)?3:1.5, opacity:.92},svg);
      rect._baseY=y0; rect._baseH=Math.max(1.5,y1-y0);
      rect.dataset.tip = cfg.tipFn? cfg.tipFn(b,i,s,v) : `<div class="tt-t">${esc(b.label)}</div><div class="tt-r"><i style="background:${s.color}"></i>${esc(s.name)} <b>${cfg.yFmt(v)}</b></div>`;
      if(animDur){
        rect.style.transformOrigin=`${stacked?Xc(i):x+bw/2}px ${mT+ih}px`;
        rect.style.transform='scaleY(0)';
        rect.style.transition=`transform ${animDur}ms cubic-bezier(.25,.9,.3,1) ${i*22+si*60}ms`;
        requestAnimationFrame(()=>requestAnimationFrame(()=>rect.style.transform='scaleY(1)'));
      }
      rect.addEventListener('mouseenter',ev=>{rect.style.opacity=1;rect.style.filter='brightness(1.22)';ttShow(rect.dataset.tip,ev.clientX,ev.clientY);});
      rect.addEventListener('mouseleave',()=>{rect.style.opacity=.92;rect.style.filter='';ttHide();});
    });
    if(cfg.marker){
      cfg.marker.forEach(m=>{
        const y=Y(m.v);
        const line=S('line',{x1:Xc(i)-bw*.75,x2:Xc(i)+bw*.75,y1:y,y2:y,stroke:m.color||'rgba(236,233,225,.55)','stroke-width':1.5,'stroke-dasharray':'3 3',opacity:0},svg);
        requestAnimationFrame(()=>requestAnimationFrame(()=>line.style.opacity=.8));
        line._tip=`<div class="tt-t">${esc(b.label)}</div><div class="tt-r">${m.name} <b>${cfg.yFmt(m.v)}</b></div>`;
        line.addEventListener('mouseenter',ev=>ttShow(line._tip,ev.clientX,ev.clientY));
        line.addEventListener('mouseleave',ttHide);
      });
    }
    if(n<=44 && (n<=24 || i%Math.ceil(n/24)===0)){
      S('text',{x:Xc(i),y:H-11,'text-anchor':'middle','font-size':9.5,fill:TXT3},svg).textContent=b.label;
    }
  });
  return {svg};
}

/* --- donut --- */
function donut(host, items, centerLabel, centerVal){
  host.innerHTML='';
  const W = host.clientWidth||300, H = W, R = W/2, r = R*0.66;
  const svg = S('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`},host);
  svg.style.display='block';
  const total = items.reduce((a,b)=>a+b.value,0);
  let ang = -Math.PI/2;
  const rm = !animOK();
  items.forEach((it,idx)=>{
    const frac = it.value/total, a2 = ang + frac*Math.PI*2;
    const large = frac>.5?1:0, pad=0.012;
    const a1 = ang + pad/2, b1 = a2 - pad/2;
    const x1=R+Math.cos(a1)*R, y1=R+Math.sin(a1)*R, x2=R+Math.cos(b1)*R, y2=R+Math.sin(b1)*R;
    const x3=R+Math.cos(b1)*r, y3=R+Math.sin(b1)*r, x4=R+Math.cos(a1)*r, y4=R+Math.sin(a1)*r;
    const p = S('path',{d:`M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${large} 0 ${x4} ${y4} Z`,
      fill:it.color, opacity:0.92, cursor:'pointer'},svg);
    p.style.transformOrigin=`${R}px ${R}px`;
    if(!rm){
      p.style.opacity=0; p.style.transform='scale(.86)';
      p.style.transition=`opacity .5s ${idx*90+200}ms, transform .6s cubic-bezier(.22,.8,.3,1) ${idx*90+200}ms`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.opacity=.92;p.style.transform='scale(1)';}));
    }
    p.addEventListener('mouseenter',ev=>{
      p.style.opacity=1; p.style.transform='scale(1.035)';
      ttShow(`<div class="tt-t">${esc(it.name)}</div><div class="tt-r"><i style="background:${it.color}"></i><b>${fi(it.value)}</b> — ${fpc(frac,1)}</div>`,ev.clientX,ev.clientY);
    });
    p.addEventListener('mouseleave',()=>{p.style.opacity=.92;p.style.transform='scale(1)';ttHide();});
    ang = a2;
  });
  const c1=S('text',{x:R,y:R-4,'text-anchor':'middle','font-size':R*0.19,'font-weight':650,fill:'#ece9e1','font-variant-numeric':'tabular-nums'},svg);
  c1.textContent = centerVal!=null?centerVal:fi(total);
  const c2=S('text',{x:R,y:R+15,'text-anchor':'middle','font-size':10,fill:TXT3},svg);
  c2.textContent = centerLabel||'';
}

function tdbNewPerEp(){
  const arr = DATA.tdb.ecoutesNewParEp;
  for(let i=arr.length-1;i>=0;i--) if(arr[i]!=null) return arr[i];
  return null;
}
function ratio30(){ return DATA.kpisTdb.ytdRatio30 || 0.2446; }
function ratio60(){ return DATA.kpisTdb.ytdRatio60 || 0.1454; }
function derive(e){
  if(e.audioblog!=null || e.youtube!=null) e.lecturesVerifiees = (e.audioblog||0)+(e.youtube||0);
  if(e.spotify30!=null || e.autre30!=null) e.total30 = (e.spotify30||0)+(e.autre30||0);
  if(e.total30!=null) e.totalAjuste30 = Math.round(e.total30 + (e.lecturesVerifiees||0)*ratio30());
  if(e.youtube!=null && e.retentionYt30!=null) e.ytEst30 = Math.round(e.youtube*e.retentionYt30*1000)/1000;
  if(e.youtube!=null && e.retentionYt60!=null) e.ytEst60 = Math.round(e.youtube*e.retentionYt60*1000)/1000;
  if(e.auditeursUniques && e.total30) e.ecoutesParAuditeur = Math.round(e.total30/e.auditeursUniques*10000)/10000;
  if(e.streams60!=null && e.lecturesVerifiees!=null) e.streams60Total = Math.round(e.streams60 + e.lecturesVerifiees*ratio60());
}
function refreshSummary(){
  const s = DATA.summary;
  const sum = k => DATA.episodes.reduce((a,e)=>a+(typeof e[k]==='number'?e[k]:0),0);
  s.sommeSpotify30 = sum('spotify30'); s.sommeAutre30 = sum('autre30');
  s.sommeTotal30 = sum('total30'); s.sommeAjuste30 = Math.round(sum('totalAjuste30'));
  s.sommeAuditeurs = sum('auditeursUniques'); s.sommeLecturesVerifiees = sum('lecturesVerifiees');
  s.sommeAudioblog = sum('audioblog'); s.sommeYoutube = sum('youtube');
  s.sommeTempsSec = sum('tempsLectureTotalSec');
  s.sommeStreams60 = sum('streams60'); s.sommeStreams60Total = Math.round(sum('streams60Total'));
  DATA.summary = s;
}

function drow(k,v,cls){ return `<div class="drow"><span class="k">${k}</span><span class="v ${cls||''}">${v==null?'—':v}</span></div>`; }

function vRetention(){

      {name:'Rétention 30 s', color:YT, points:pub.map(e=>e.retentionYt30), area:true, tooltip:(i,v)=>ttEp(pub[i],'Rétention 30 s',fpc(v,1),YT)},
      {name:'Rétention 60 s', color:GOLD, points:pub.map(e=>e.retentionYt60), tooltip:(i,v)=>ttEp(pub[i],'Rétention 60 s',fpc(v,1),GOLD)},
    ], yFmt:v=>fpc(v,0)});
  new barChart(document.getElementById('ch-compl'), {xLabels:lbl, height:230,
    bars:pub.map(e=>({label:e.num.replace('E',''), vals:{c:e.completion||0}})),
    series:[{key:'c',name:'Complétion',color:GREEN}], yFmt:v=>fpc(v,0),
    tipFn:(b,i)=>ttHtml(pub[i],'Complétion J0–J7',fpc(pub[i].completion,1),GREEN)});
  new barChart(document.getElementById('ch-dur'), {xLabels:lbl, height:230, stacked:false,
    bars:pub.map(e=>({label:e.num.replace('E',''), vals:{sp:e.pctLectureSpotify||0, ytb:e.pctLectureYoutube||0}})),
    series:[{key:'sp',name:'Spotify',color:GOLD},{key:'ytb',name:'YouTube',color:YT}], yFmt:v=>fpc(v,0),
    tipFn:(b,i,s,v)=>ttHtml(pub[i], s.name, fpc(v,1), s.color)});

document.getElementById('btn-import').addEventListener('click', ()=>document.getElementById('file-import').click());
document.getElementById('file-import').addEventListener('change', ev=>{
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const j = JSON.parse(r.result);
      if(!j.episodes || !j.tdb) throw new Error('format');
      DATA = j; persist(); renderChips(); reRenderAll();
      toast('Données <b>importées</b>.');
    }catch(e){ toast('Fichier illisible — importez un instantané exporté de ce tableau.'); }
  };
  r.readAsText(f);
  ev.target.value='';
});
document.getElementById('btn-reset').addEventListener('click', ()=>{
  try{ localStorage.removeItem('lbr-data'); }catch(e){}
  DATA = JSON.parse(JSON.stringify(SEED));
  renderChips(); reRenderAll();
  toast('Retour aux données du <b>classeur</b>.');
});
function reRenderAll(){
  document.querySelectorAll('.view').forEach(v=>delete v.dataset.done);
  ANIM=false; renderView(currentView);
  setTimeout(()=>ANIM=true, 900);
}
document.getElementById('burger').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));

let rz;
addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ if(document.querySelector('.view.on')){ ANIM=false; renderView(currentView); setTimeout(()=>ANIM=true,900);} }, 260); });

renderChips();
goto('apercu');
</script>
</body>
</html>
